{{- if and .Values.huggingface.token (not .Values.huggingface.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ollaya.fullname" . }}-hf
  labels: {{- include "ollaya.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.huggingface.existingSecretKey }}: {{ .Values.huggingface.token | quote }}
{{- end }}
{{- if and .Values.apiKey.value (not .Values.apiKey.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ollaya.fullname" . }}-api
  labels: {{- include "ollaya.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiKey.existingSecretKey }}: {{ .Values.apiKey.value | quote }}
{{- end }}
