{{- if and (include "ollaya.apiSecretName" .) (not .Values.apiKey.existingSecret) }}
{{- $name := include "ollaya.apiSecretName" . }}
{{- $k := .Values.apiKey.existingSecretKey }}
{{- $key := .Values.apiKey.value }}
{{- if not $key }}
{{- /* generate: reuse the key from a previous install/upgrade so it never changes under clients */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $old $old.data (hasKey $old.data $k) }}{{ $key = index $old.data $k | b64dec }}{{ else }}{{ $key = randAlphaNum 32 }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ollaya.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $k }}: {{ $key | quote }}
{{- end }}
