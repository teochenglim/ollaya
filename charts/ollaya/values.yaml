image:
  repository: ghcr.io/teochenglim/ollaya
  # Defaults to the chart appVersion. GPU adds the suffix automatically (see gpu.variant).
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# GPU: requires the NVIDIA device plugin (or GPU Operator) in the cluster.
gpu:
  enabled: false
  variant: cuda        # cuda (CUDA 13, driver R580+) | cuda12 (driver R525+)
  count: 1
  runtimeClassName: "" # e.g. nvidia, if your cluster needs it

# Optional API key clients must send as "Authorization: Bearer <key>".
# Strongly recommended with service.type NodePort/LoadBalancer or ingress.enabled.
apiKey:
  generate: false      # true: create a random key once (kept across upgrades); NOTES shows how to read it
  existingSecret: ""   # or reference your own Secret
  existingSecretKey: key
  value: ""            # or set it inline (ends up in Helm release state)

ollaya:
  # Models to pull into the PVC on pod start (init container; skips ones already present).
  # Change this list + `helm upgrade` to switch models; no image change needed.
  models: [laya]
  preload: ""          # e.g. "laya:en,laya:multilingual" (readiness waits for these)
  readOnly: false      # refuse pull/create/delete over HTTP (pre-seed the PVC first)
  keepAlive: ""
  maxLoadedModels: ""
  extraEnv: []         # - {name: OLLAYA_LOG, value: debug}

persistence:
  enabled: true
  size: 20Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  existingClaim: ""

service:
  type: ClusterIP      # ClusterIP | NodePort | LoadBalancer
  port: 11435
  nodePort: null       # with type NodePort, e.g. 30808 (range 30000-32767)

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ollaya.example.com
      paths: [{path: /, pathType: Prefix}]
  tls: []

resources:
  # Size memory for your largest model x OLLAYA_MAX_LOADED_MODELS (jeb:4b ~4.6GB, winnow:e4b ~8GB).
  requests: {cpu: 500m, memory: 2Gi}
  limits: {memory: 8Gi}

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
